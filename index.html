  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .font-mono-code {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Бегущая строка новостей */
    @keyframes tickerScroll {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    .news-ticker-track {
      display: flex;
      width: max-content;
      animation: tickerScroll 26s linear infinite;
    }
    /* Мигалки милиции */
    @keyframes sirenRed {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.75; }
    }
    @keyframes sirenBlue {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 0.15; }
    }
    .siren-red { animation: sirenRed 1.4s infinite ease-in-out; }
    .siren-blue { animation: sirenBlue 1.4s infinite ease-in-out; }

    /* Пульсация криминалистических маркеров */
    @keyframes markerPulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.75); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 12px rgba(250, 204, 21, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
    }
    .evidence-marker {
      animation: markerPulse 2s infinite;
    }

    /* Эффект сканирующих линий для фоторобота и CCTV */
    .scanlines {
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.28) 50%
      );
      background-size: 100% 4px;
    }

    /* Кастомный скроллбар для досье и списков */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.7);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.9);
    }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; color-scheme: dark; }
    .vn-stage { width: 100%; height: 100vh; height: 100dvh; }
    #scene-container { min-height: 0; }
    #top-hud { flex-shrink: 0; }
    #scene-container[data-stage="title"] > div,
    #scene-container[data-stage="ending"] > div { overflow-y: auto; }
    #scene-container[data-stage="title"] > div { align-items: safe center; }
    .interview-menu { width: min(28rem, calc(100% - 1.5rem)); overflow-y: auto; min-height: 0; }
    .evidence-label { max-width: clamp(75px, 16vw, 180px); white-space: normal; }
    .evidence-floor { pointer-events: none; mask-image: linear-gradient(transparent, black 12%, black 87%, transparent); }
    .evidence-field + div { flex-shrink: 0; }
    .lab-tabs { flex-wrap: wrap; }
    .scene-cut { animation: scene-cut .36s ease-out both; }
    @keyframes scene-cut { from { opacity: .35; } to { opacity: 1; } }

    .cinema {
      position: fixed; inset: 0; width: 100%; max-width: none; height: 100%; max-height: none;
      margin: 0; padding: 0; border: 0; color: #eef2ff; background: #070c17;
    }
    .cinema:not([open]) { display: none; }
    .cinema[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; isolation: isolate; }
    .cinema-background, .cinema-veil { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
    .cinema-background { animation: camera-in 1.3s ease-out both; }
    .cinema-veil { background: radial-gradient(ellipse at 50% 35%, transparent, #050915aa 84%), linear-gradient(0deg, #050915, transparent 72%); }
    .cinema-header {
      display: flex; justify-content: space-between; align-items: center; gap: .75rem;
      border-bottom: 1px solid #a2b5d322; background: #070c17d9;
      padding: .75rem clamp(1rem, 4vw, 3.5rem); font-size: .78rem;
      letter-spacing: .12em; color: #fde68a; font-weight: 750;
    }
    .cinema-live::before {
      content: ""; display: inline-block; margin-right: .5rem; width: .48rem; height: .48rem;
      border-radius: 50%; background: #fb7185; animation: led 2s ease-in-out infinite;
    }
    .cinema-art { min-height: 0; display: grid; place-items: center; overflow: hidden; position: relative; }
    .cinema-portrait { height: 100%; width: min(72vw, 35rem); animation: portrait-in .55s ease-out both; }
    .cinema-portrait > svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 14px 26px #020617); }
    .cinema-art.is-question .cinema-portrait { opacity: .64; transform: scale(.93); }
    .cinema-prop {
      position: relative; display: grid; place-items: center; height: 82%; aspect-ratio: 1;
      max-width: min(60vw, 330px); max-height: 330px;
      border: 1px solid #cbedff54; border-radius: 18px;
      background: radial-gradient(ellipse at 45% 25%, #2c455a, #0d1826 72%);
      box-shadow: 0 20px 65px #02061799, inset 0 0 30px #0006; overflow: hidden;
      animation: portrait-in .52s ease-out both;
    }
    .cinema-prop::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;

    const SoundFX = {
      enabled: true,
      ctx: null,
      init() {
        if (!this.ctx) {

        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }

        if (!this.enabled) return;

        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(280, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);

        if (!this.enabled) return;

        osc.type = 'triangle';

        const notes = [440, 554.37, 659.25];

          osc.type = 'sine';

          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.25);
        });
      },

          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.55);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.55);
        });
      }

      el.className = `px-3.5 py-2.5 rounded-xl border ${borderClass} shadow-xl text-xs font-semibold transition-all duration-300 transform translate-x-0`;

    // =========================================================================

    function setStage(stageName) {
      SoundFX.playClick();
      GameState.currentStage = stageName;
      const hud = document.getElementById('top-hud');
      if (stageName === 'title') {
        hud.classList.add('hidden');
      } else {
        hud.classList.remove('hidden');
      }
      updateHUD();
      renderCurrentScene();
      animateSceneCut();
    }

    function animateSceneCut() {
      const scene = document.getElementById('scene-container').firstElementChild;
      scene?.classList.add('scene-cut');
    }

    function updateHUD() {
      const stageNames = {
        prologue: 'Пролог: Выпуск «Хроника 24»',
        stage1: 'Этап 1: Осмотр места происшествия (4-й этаж)',
        stage2: 'Этап 2: Опрос свидетеля и Фоторобот',
        stage3: 'Этап 3: Криминалистическая лаборатория',
        stage4: 'Этап 4: Допросы в Следственном комитете',
        stage5: 'Этап 5: Хронология и Обвинение',
        ending: 'Финал: Итоги расследования'
      };
      const titleEl = document.getElementById('hud-stage-title');
      if (titleEl) titleEl.textContent = stageNames[GameState.currentStage] || 'Расследование';

      const badgeEl = document.getElementById('hud-clue-badge');
      if (badgeEl) badgeEl.textContent = `${GameState.discoveredClues.length}/${ALL_CLUES.length}`;

      // Расчёт прогресса
      let pct = 5;
      if (GameState.unlockedStage >= 1) pct = 15;
      pct += GameState.inspectedMarkers.length * 3; // +15%
      if (GameState.identikitCompleted) pct += 20;    // 50%
      if (GameState.cctvTagged2226 && GameState.cctvTagged2243) pct += 7;
      if (GameState.billingSolved) pct += 7;
      if (GameState.traceSolved) pct += 6;          // 70%
      if (GameState.interrogation.melnikov.broken) pct += 6;
      if (GameState.interrogation.gromov.broken) pct += 6;
      if (GameState.interrogation.lebedeva.broken) pct += 8; // 90%
      if (GameState.currentStage === 'ending') pct = 100;

      const bar = document.getElementById('hud-progress-bar');
      const txt = document.getElementById('hud-progress-text');
      if (bar) bar.style.width = `${Math.min(100, pct)}%`;
      if (txt) txt.textContent = `${Math.min(100, pct)}%`;
    }

    function typeText(elementId, fullText, speed = 16) {
      if (typewriterTimer) clearInterval(typewriterTimer);
      const el = document.getElementById(elementId);
      if (!el) return;
      el.textContent = '';
      el.dataset.fullText = fullText;
      let i = 0;
      typewriterTimer = setInterval(() => {
        if (i < fullText.length) {
          el.textContent += fullText.charAt(i);
          if (i % 4 === 0) SoundFX.playType();
          i++;
        } else {
          clearInterval(typewriterTimer);
          typewriterTimer = null;
        }
      }, speed);
    }

    function skipTypewriter(elementId) {
      const el = document.getElementById(elementId);
      if (el && typewriterTimer) {
        clearInterval(typewriterTimer);
        typewriterTimer = null;
        el.textContent = el.dataset.fullText || el.textContent;
      }
    }

    function renderCurrentScene() {
      const container = document.getElementById('scene-container');
      container.dataset.stage = GameState.currentStage;
      switch (GameState.currentStage) {
        case 'title':    renderTitleScreen(container); break;
        case 'prologue': renderPrologue(container); break;
        case 'stage1':   renderStage1(container); break;
        case 'stage2':   renderStage2(container); break;
        case 'stage3':   renderStage3(container); break;
        case 'stage4':   renderStage4(container); break;
        case 'stage5':   renderStage5(container); break;
        case 'ending':   renderEnding(container); break;
      }
    }

    function inspectMarker(num) {
      const marker = STAGE1_MARKERS.find(m => m.num === num);
      if (!marker) return;
      const { clueId, label, speech } = marker;
      const [pickup, packed] = PICKUP_ACTIONS[clueId];
      const inspected = GameState.inspectedMarkers.includes(num);
      SoundFX.playClick();
      showCinematic({
        background: 'stairs',
        label: `Осмотр места · Маркер 0${num}`,
        beats: inspected
          ? [{ speaker: label, text: speech, art: evidenceArt(clueId, 'sealed'), next: 'К осмотру этажа' }]
          : [
              { speaker: 'Следователь', text: pickup, art: evidenceArt(clueId, 'lift'), next: 'Рассмотреть' },
              { speaker: label, text: speech, art: evidenceArt(clueId), next: 'Зафиксировать улику' },
              { speaker: 'Запись в протоколе', text: packed, art: evidenceArt(clueId, 'sealed'), next: 'К осмотру этажа' }
            ],
        finish: () => {
          if (!inspected) GameState.inspectedMarkers.push(num);
          addClue(clueId);
          renderCurrentScene();
        }
      });
    }

    // --- ЭТАП 2: ОПРОС СВИДЕТЕЛЯ И КОНСТРУКТОР ФОТОРОБОТА ---

      if (!q) return;

      if (!GameState.witnessAsked.includes(qId)) GameState.witnessAsked.push(qId);
      GameState.witnessDialogueText = q.answer;
      showConversation({ id: 'witness', speaker: 'Ирина Павловна Ковалёва',
        question: q.label.replace(/^\d+\. /, ''), answer: q.answer, mood: 'nervous' });
    }

    function openIdentikitBuilder() {
      SoundFX.playClick();
      GameState.stage2Phase = 'builder';
      renderStage2(document.getElementById('scene-container'));
    }

    function calculateIdentikitAccuracy() {
      let matches = 0;
      IDENTIKIT_CATEGORIES.forEach(cat => {
        if (GameState.identikit[cat.key] === cat.correct) matches++;
      });
      return Math.round((matches / IDENTIKIT_CATEGORIES.length) * 100);
    }

                    <button onclick="setIdentikitPart('${activeCat.key}', ${opt.id})" class="p-2 rounded-xl border ${isCurrent ? 'bg-sky-950/90 border-sky-400 shadow-[0_0_15px_rgba(56,189,248,0.25)]' : 'bg-slate-900/90 border-slate-800 hover:border-slate-600'} flex flex-col items-center justify-between gap-1.5 transition cursor-pointer">

    function selectIdentikitCategory(key) {
      SoundFX.playClick();
      GameState.identikitActiveCat = key;
      renderIdentikitBuilder(document.getElementById('scene-container'));
    }

    function setIdentikitPart(key, val) {
      SoundFX.playClick();
      GameState.identikit[key] = val;
      renderIdentikitBuilder(document.getElementById('scene-container'));
    }

    function submitIdentikit() {
      const accuracy = calculateIdentikitAccuracy();
      if (accuracy < 83) {
        showToast(`Точность фоторобота всего ${accuracy}%. Сверьтесь с блокнотом свидетеля справа (нужно минимум 83%).`, 'red');
        return;
      }
      GameState.identikitScore = accuracy;
      GameState.identikitCompleted = true;
      addClue('clue_identikit');
      GameState.unlockedStage = Math.max(GameState.unlockedStage, 3);
      const art = `<div class="cinema-prop">${renderIdentikitSVG(GameState.identikit)}</div>`;
      showReport('lab', 'ГКСЭ · Сверка портрета', 'Эксперт',
        `Фоторобот утверждён. Совпало признаков на ${accuracy}%. База выдала совпадение: Денис Громов.`,
        art, () => setStage('stage3'), 'К экспертизам');
    }

    // --- ЭТАП 3: КРИМИНАЛИСТИЧЕСКИЕ ЭКСПЕРТИЗЫ (3 ЛАБОРАТОРНЫХ ЗАДАНИЯ) ---

      const cctvDone = GameState.cctvTagged2226 && GameState.cctvTagged2243;
      const billingDone = GameState.billingSolved;
      const traceDone = GameState.traceSolved;

      container.innerHTML = `

              </button>
              <button onclick="switchLabTab('trace')" class="px-3 py-1.5 rounded-lg text-xs font-bold border transition cursor-pointer ${GameState.activeLabTab === 'trace' ? 'bg-sky-600/30 border-sky-400 text-white' : 'bg-slate-900 border-slate-700 text-slate-400'}">
                ${traceDone ? '✅' : '3.'} Трасология и химия
              </button>
            </div>

            ${allLabsDone ? `
              <button onclick="completeStage3()" class="px-4 py-1.5 rounded-xl bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg transition cursor-pointer">

              </button>

              <span class="text-xs text-slate-400 font-mono-code">Выполнено: ${(cctvDone?1:0)+(billingDone?1:0)+(traceDone?1:0)}/3</span>

              GameState.activeLabTab === 'billing' ? renderLabBilling() :
              renderLabTrace()}

        </div>
      `;
    }

    function switchLabTab(tab) {
      SoundFX.playClick();
      const traceForm = document.querySelector('.trace-form');
      if (traceForm && !GameState.traceSolved) {
        GameState.traceMatches = Object.fromEntries(new FormData(traceForm));
      }
      GameState.activeLabTab = tab;
      renderStage3(document.getElementById('scene-container'));
    }

    // Экспертиза 1: CCTV
    function renderLabCCTV() {
      const enhanced = GameState.cctvBrightness >= 135 && GameState.cctvContrast >= 130;
      const t = GameState.cctvTime;

      let figureSVG = '';
      let frameDesc = 'Двор у подъезда №2 пуст. Движения в кадре не зафиксировано.';
      if (t === '22:26') {
        figureSVG = `
          <g opacity="${enhanced ? '0.95' : '0.18'}">

            <text x="240" y="92" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11">ОБЪЕКТ А: ДЛИННОЕ ПАЛЬТО</text>
          </g>`;
        frameDesc = enhanced
          ? 'Чётко виден высокий мужчина в длинном тёмном пальто (В. Мельников), спокойно выходящий из подъезда в 22:26.'

          <g opacity="${enhanced ? '0.95' : '0.18'}">

          </g>`;
        frameDesc = enhanced

      return `
        <div class="cctv-layout grid grid-cols-12 gap-4 items-center stack-small">

            <div class="relative w-full aspect-video rounded-xl overflow-hidden border-2 border-slate-700 bg-black">
              <svg id="camera-feed" viewBox="0 0 480 270" class="w-full h-full" style="filter: brightness(${GameState.cctvBrightness}%) contrast(${GameState.cctvContrast}%) grayscale(100%);">
                <rect width="480" height="270" fill="#090d16"/>
                <rect x="40" y="20" width="160" height="220" fill="#111827" stroke="#1f2937"/>

              <div class="absolute inset-0 scanlines pointer-events-none"></div>

              <div class="absolute top-2.5 right-3 px-2 py-0.5 bg-red-600/80 text-white font-mono-code text-[10px]">REC ●</div>
            </div>
            <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300">${frameDesc}</div>
          </div>

          <div class="col-span-5 flex flex-col gap-3">
            <div class="text-sm font-extrabold text-sky-300">Улучшение чёткости и сверка таймкодов</div>
            <p class="text-xs text-slate-400">Отрегулируйте фильтры камеры, просмотрите ключевые таймкоды (22:26 и 22:43) и зафиксируйте обоих подозреваемых.</p>

            <div class="space-y-2 bg-slate-900 p-3 rounded-xl border border-slate-800">
              <label class="flex justify-between text-xs"><span>Яркость сигнала:</span><span class="font-mono-code text-amber-300">${GameState.cctvBrightness}%</span></label>
              <input type="range" min="80" max="180" value="${GameState.cctvBrightness}" oninput="updateCameraFilter(this, 'cctvBrightness')" onchange="renderCurrentScene()" class="w-full accent-sky-400 cursor-pointer">

              <label class="flex justify-between text-xs"><span>Контрастность контуров:</span><span class="font-mono-code text-amber-300">${GameState.cctvContrast}%</span></label>
              <input type="range" min="80" max="180" value="${GameState.cctvContrast}" oninput="updateCameraFilter(this, 'cctvContrast')" onchange="renderCurrentScene()" class="w-full accent-sky-400 cursor-pointer">

            <div class="grid grid-cols-4 gap-1.5">
              ${['22:15', '22:26', '22:43', '22:55'].map(tm => `
                <button onclick="GameState.cctvTime='${tm}'; SoundFX.playClick(); renderStage3(document.getElementById('scene-container'))" class="py-1.5 rounded-lg font-mono-code text-xs font-bold border cursor-pointer ${t === tm ? 'bg-amber-500 text-slate-950 border-amber-300' : 'bg-slate-900 text-slate-300 border-slate-700'}">
                  ${tm}
                </button>
              `).join('')}
            </div>

            <div class="space-y-1.5">
              <button onclick="tagCCTV('22:26')" class="w-full py-2 px-3 rounded-xl text-xs font-bold border transition cursor-pointer ${GameState.cctvTagged2226 ? 'bg-emerald-950/70 border-emerald-500 text-emerald-300' : 'bg-slate-800 hover:bg-slate-700 border-slate-600 text-white'}">
                ${GameState.cctvTagged2226 ? '✅ Зафиксировано: 22:26 — Выход В. Мельникова' : '📌 Зафиксировать кадр 22:26 (Мужчина в пальто)'}
              </button>
              <button onclick="tagCCTV('22:43')" class="w-full py-2 px-3 rounded-xl text-xs font-bold border transition cursor-pointer ${GameState.cctvTagged2243 ? 'bg-emerald-950/70 border-emerald-500 text-emerald-300' : 'bg-slate-800 hover:bg-slate-700 border-slate-600 text-white'}">
                ${GameState.cctvTagged2243 ? '✅ Зафиксировано: 22:43 — Побег Д. Громова' : '📌 Зафиксировать кадр 22:43 (Совпадение с фотороботом)'}

          </div>
        </div>
      `;
    }

    function updateCameraFilter(input, key) {
      GameState[key] = Number(input.value);
      input.previousElementSibling.lastElementChild.textContent = input.value + '%';
      document.getElementById('camera-feed').style.filter =
        `brightness(${GameState.cctvBrightness}%) contrast(${GameState.cctvContrast}%) grayscale(100%)`;
    }

    function tagCCTV(tm) {
      if (GameState.cctvBrightness < 135 || GameState.cctvContrast < 130) {
        showToast('Сначала повысьте яркость (≥135%) и контраст (≥130%) для идентификации!', 'red');
        return;
      }
      if (GameState.cctvTime !== tm) {
        GameState.cctvTime = tm;
      }
      const tagged = tm === '22:26' ? GameState.cctvTagged2226 : GameState.cctvTagged2243;
      if (tagged) return;
      if (tm === '22:26') GameState.cctvTagged2226 = true;
      if (tm === '22:43') GameState.cctvTagged2243 = true;
      SoundFX.playClue();
      if (GameState.cctvTagged2226 && GameState.cctvTagged2243) {
        addClue('clue_cctv');
      }
      const suspect = tm === '22:26' ? 'melnikov' : 'gromov';
      const message = tm === '22:26'
        ? '22:26. Мельников в длинном пальто выходит через арку. Этот кадр пригодится при проверке его алиби.'
        : '22:43. Из подъезда выбегает Громов. Сопоставьте этот кадр с показаниями Ковалёвой.';
      showReport('courtyard', `Камера в арке · Кадр ${tm}`, 'Эксперт ГКСЭ', message,
        portraitArt(suspect, 'calm'), renderCurrentScene, 'К записям камеры');
    }

    // Экспертиза 2: Биллинг и звонки
    const BILLING_LOGS = [
      { id: 'b1', time: '19:40', caller: 'Мама (Воронцова Е.И.)', dur: '04:12', tower: 'ул. Садовая, 12', anomaly: false },
      { id: 'b2', time: '21:15', caller: 'Курьер доставки еды', dur: '00:38', tower: 'ул. Садовая, 12', anomaly: false },
      { id: 'b3', time: '22:10', caller: 'Мельников В.А. («Монолит-Строй»)', dur: '00:42', tower: 'ул. Садовая, 12 (рядом с домом!)', anomaly: true },
      { id: 'b4', time: '22:30', caller: 'Спам-робот банка', dur: '00:05', tower: 'ул. Садовая, 12', anomaly: false },
      { id: 'b5', time: '22:44', caller: 'Лебедева С.И. (Соседка, кв. 27)', dur: '00:14', tower: 'ул. Садовая, 12 — «Открой, я забыла флешку!»', anomaly: true }
    ];

    function renderLabBilling() {
      return `
        <div class="flex flex-col gap-3 h-full justify-between">

            <div class="text-sm font-extrabold text-sky-300 mb-1">Детализация звонков и биллинг базовых станций</div>

          </div>

          <div class="space-y-2">
            ${BILLING_LOGS.map(log => {
              const selected = GameState.billingSelected.includes(log.id);
              return `
                <button onclick="toggleBillingItem('${log.id}')" class="w-full p-3 rounded-xl border text-left transition flex items-center justify-between gap-3 cursor-pointer ${selected ? 'bg-amber-950/50 border-amber-400 text-white' : 'bg-slate-900 border-slate-800 hover:border-slate-600 text-slate-300'}">
                  <div class="flex items-center gap-3">
                    <span class="font-mono-code font-bold text-amber-400 text-xs">${log.time}</span>
                    <div>
                      <div class="font-bold text-xs sm:text-sm">${log.caller}</div>
                      <div class="text-[11px] text-slate-400">Вышка связи: ${log.tower} • Длительность: ${log.dur}</div>
                    </div>
                  </div>
                  <span class="px-2.5 py-1 rounded text-xs font-bold ${selected ? 'bg-amber-400 text-slate-950' : 'bg-slate-800 text-slate-400'}">
                    ${selected ? '✓ Выбрано' : 'Выбрать'}
                  </span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="flex items-center justify-between pt-1">
            <span class="text-xs text-slate-400">${GameState.billingSolved ? '✅ Зацепки успешно приобщены к материалам дела!' : 'Выберите ровно 2 подозрительных контакта'}</span>
            <button onclick="verifyBilling()" class="px-5 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold text-xs cursor-pointer">
              Подтвердить анализ биллинга
            </button>
          </div>
        </div>
      `;
    }

    function toggleBillingItem(id) {
      if (GameState.billingSolved) return;
      SoundFX.playClick();
      const idx = GameState.billingSelected.indexOf(id);
      if (idx >= 0) {
        GameState.billingSelected.splice(idx, 1);
      } else {
        if (GameState.billingSelected.length >= 2) GameState.billingSelected.shift();
        GameState.billingSelected.push(id);

    function moveChrono(index, dir) {
      SoundFX.playClick();
      const target = index + dir;
      if (target < 0 || target >= GameState.chronologyOrder.length) return;
      const arr = GameState.chronologyOrder;
      [arr[index], arr[target]] = [arr[target], arr[index]];
      renderStage5(document.getElementById('scene-container'));
    }

    function checkChronology(finish = renderCurrentScene) {
      const ok = JSON.stringify(GameState.chronologyOrder) === JSON.stringify(CORRECT_CHRONOLOGY);
      if (ok) {
        GameState.chronologyLocked = true;
        SoundFX.playClue();
        showCinematic({
          background: 'stairs', label: 'Реконструкция · Садовая, 14', finish,
          beats: CORRECT_CHRONOLOGY.map((id, index) => {
            const event = CHRONOLOGY_EVENTS[id];
            const suspect = ['melnikov', 'melnikov', 'gromov', 'gromov', 'lebedeva'][index];
            return { speaker: event.time, text: event.text, art: portraitArt(suspect, 'calm'),
              next: index === CORRECT_CHRONOLOGY.length - 1 ? 'К протоколу' : 'Следующее событие' };
          })
        });
      } else {
        showToast('Последовательность нарушена! Вспомните время на камерах (22:26 и 22:43) и звонок в 22:44.', 'red');
      }
    }

    function submitFinalVerdict() {
      const v = GameState.verdict;
      if (!v.killer || !v.lastSeen || !v.motive || !v.alibiReason) {
        showToast('Заполните все 4 пункта обвинительного заключения!', 'red');
        return;
      }
      if (!GameState.chronologyLocked) {
        checkChronology(submitFinalVerdict);
        return;
      }

      if (v.killer === 'gromov') {
        GameState.endingType = 'wrong_suspect';
      } else if (v.killer === 'lebedeva' && v.lastSeen === 'gromov' && v.motive === 'forgery' && v.alibiReason === 'neighbor') {
        GameState.endingType = 'perfect';
      } else {
        GameState.endingType = 'incomplete';
      }

      GameState.unlockedStage = 6;
      showReport('studio', 'Хроника 24 · Подготовка эфира', 'Ведущий',
        'Протокол получен. Сейчас в эфире — итог расследования на Садовой улице.',
        portraitArt('anchor', 'calm'), () => setStage('ending'), 'Смотреть выпуск');
    }

    // Врезки используют те же декорации и портреты, что и основные сцены.
    const cinema = document.getElementById('cinema');
    let cinemaSequence = null;

    function showCinematic({ background, label, beats, finish = renderCurrentScene, centered = false }) {
      if (cinema.open) return;
      cinemaSequence = { background, label, beats, finish, index: 0 };
      cinema.classList.toggle('cinema-centered', centered);
      renderCinematicBeat();
      cinema.showModal();
      cinema.querySelector('button').focus();
    }

    function renderCinematicBeat() {
      const { background, label, beats, index } = cinemaSequence;
      const beat = beats[index];
      if (beat.revealed) SoundFX.playObjection();
      cinema.innerHTML = `
        <div class="cinema-background" aria-hidden="true">${getBackgroundSVG(background)}</div>
        <div class="cinema-veil"></div>
        <div class="cinema-header"><span>${label}</span><span class="cinema-live">${index + 1} / ${beats.length}</span></div>
        <div class="cinema-art ${beat.question ? 'is-question' : ''}" aria-hidden="true">${beat.art || ''}</div>
        <section class="cinema-panel ${beat.revealed ? 'contradiction' : ''}" aria-live="polite">
          <div class="cinema-copy">
          ${beat.revealed ? '<span class="contradiction-tag">Противоречие установлено</span>' : ''}
          <h2 id="cinema-speaker">${beat.speaker}</h2>
          <p>${beat.text}</p>
          </div>
          <button type="button" class="cinema-next" onclick="advanceCinematic()">${beat.next || 'Продолжить'} →</button>
        </section>
      `;
    }

    function advanceCinematic() {
      if (!cinemaSequence) return;
      SoundFX.playClick();
      cinemaSequence.index++;
      if (cinemaSequence.index < cinemaSequence.beats.length) {
        renderCinematicBeat();
        cinema.querySelector('button').focus();
        return;
      }
      const { finish } = cinemaSequence;
      cinemaSequence = null;
      cinema.close();
      finish();
    }

    cinema.addEventListener('cancel', event => event.preventDefault());

    function portraitArt(id, mood) {
      const centered = id === 'witness' || id === 'lebedeva';
      const portrait = getCharacterSVG(id, mood);
      const framing = centered ? portrait.replace('0 0 400 520', '50 42 300 330') : portrait;
      return `<div class="cinema-portrait">${framing}</div>`;
    }

    function showConversation({ id, speaker, question, answer, mood, evidence, revealed }) {
      const witness = id === 'witness';
      showCinematic({
        background: witness ? 'witness_apt' : 'interrogation',
        centered: witness || id === 'lebedeva',
        label: witness ? 'Квартира 10 · Опрос свидетеля' : 'Следственный комитет · Допрос',
        beats: [
          { speaker: 'Следователь', text: question, question: true,
            art: evidence || portraitArt(id, mood), next: 'Выслушать ответ' },
          { speaker, text: answer, art: portraitArt(id, mood), revealed, next: evidence ? 'К допросу' : 'К вопросам' }
        ]
      });
    }

    const EVIDENCE_ART = {
      clue_body: '<path d="M38 140h116v23H38zM55 125h80l12 15H43z" fill="#94a3b8"/><path d="M73 120q-6-16 11-34l-5-21c-5-25 32-35 42-12 4 9 1 18-6 26l-9 9q18 12 22 32z" fill="#e2e8f0"/><path d="M86 95l-5 21m35-53-14 22 11 13" fill="none" stroke="#b3c2d3" stroke-width="4"/>',
      clue_brooch: '<path d="M30 108l29-58 43-23 54 18 6 52-25 15 7 24-60 23z" fill="#c8a37d"/><path d="M40 106l28-50 35-18 44 15 5 39-28 13 9 24-47 19z" fill="#e7e3ed"/><path d="M48 106l46-53 21 33-32 58z" fill="#c4d9e8"/><path d="M91 64l48-13 9 42-39 20z" fill="#f6d5df"/>',
      clue_cigarette: '<g transform="rotate(-27 96 96)"><rect x="30" y="79" width="109" height="37" rx="8" fill="#c89a72"/><path d="M92 79h46v37H92z" fill="#7d4833"/><path d="M131 79l17 4 11 12-11 17-17 4z" fill="#424656"/><path d="M41 86h42m-38 24h32" stroke="#ebbb8d" stroke-width="4"/></g>',
      clue_phone: '<rect x="56" y="19" width="80" height="155" rx="14" fill="#1d2939" stroke="#869bb1" stroke-width="5"/><rect x="63" y="29" width="66" height="130" rx="8" fill="#12192b"/><path d="M65 104l61-57v17l-61 59z" fill="#273750"/><path d="M83 150h25" stroke="#8da1bf" stroke-width="3" stroke-linecap="round"/>',
      clue_glass: '<path d="M47 31h98l-9 44q-9 35-40 35T56 75z" fill="#b4ddfd44" stroke="#cfedff" stroke-width="5"/><path d="M61 77q35 8 70 0-10 27-35 27T61 77z" fill="#f9bd58b0"/><path d="M96 110v48m-33 4h66" stroke="#cfedff" stroke-width="6" stroke-linecap="round"/>'
    };

    const PICKUP_ACTIONS = {
      clue_body: ['Приседаю у лифта. Сначала снимок места падения, затем осмотр статуэтки.', 'Снимок и описание статуэтки внесены в протокол.'],
      clue_brooch: ['У порога что-то блеснуло. Подниму осколок пинцетом и посмотрю на линию излома.', 'Перламутр упакован отдельно. Сохраним образец для сравнения.'],
      clue_cigarette: ['Подсвечиваю перила фонарём. Вот свежий окурок. Беру его за край пинцетом.', 'Окурок в отдельном пакете. Эксперты ГКСЭ проверят следы на фильтре.'],
      clue_phone: ['Достаю смартфон из внутреннего кармана. Проверю, включён ли экран.', 'Телефон изъят. Передаю устройство для цифровой экспертизы.'],
      clue_glass: ['Беру бокал в перчатках за ножку. Под лампой виден остаток жидкости.', 'Бокал зафиксирован. Остаток жидкости передаю на анализ.']
    };

    function evidenceArt(id, phase = '') {
      const drawing = EVIDENCE_ART[id];
      return drawing
        ? `<div class="cinema-prop ${phase}"><svg class="object" viewBox="0 0 192 192">${drawing}</svg></div>`
        : reportArt(id === 'clue_identikit' ? '👤' : id === 'clue_cctv' ? '◉' : '📄');
    }

    function reportArt(symbol) {
      return `<div class="cinema-prop"><span class="cinema-symbol">${symbol}</span></div>`;
    }

    function showReport(background, label, speaker, message, art, finish, next = 'Продолжить') {
      showCinematic({ background, label, finish, beats: [{ speaker, text: message, art, next }] });
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
          return;
        }
        await document.getElementById('game-root').requestFullscreen();
        if (screen.orientation?.type.startsWith('portrait') && navigator.maxTouchPoints > 0) {
          await screen.orientation.lock?.('landscape').catch(() => {});
        }
      } catch {
        showToast('Полноэкранный режим недоступен в этом окне. Откройте HTML в браузере.');
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) screen.orientation?.unlock?.();
      for (const button of document.querySelectorAll('.fullscreen-btn')) {
        button.setAttribute('aria-label', document.fullscreenElement ? 'Выйти из полноэкранного режима' : 'На весь экран');
        button.title = button.getAttribute('aria-label');
      }
    });

    // Инициализация игры после загрузки окна
    window.onload = function () {
      renderCurrentScene();
    };
  </script>
</body>
</html>
